<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Do | Choose your work set</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #181818; background: #f5f5f5; font: 1rem/1.5 system-ui, sans-serif; }
    main { max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
    h1, p { margin: 0; }
    h1 { font-size: 2rem; letter-spacing: -.035em; }
    fieldset { min-width: 0; margin: 1.25rem 0 0; padding: 1rem; border: 1px solid #999; background: white; }
    legend { padding: 0 .35rem; font-weight: 700; }
    .tree, .tree ul { list-style: none; margin: 0; padding: 0; }
    .tree ul { margin-left: .65rem; padding-left: clamp(.45rem, 2.5vw, 1.25rem); border-left: 1px solid #999; }
    label { display: flex; align-items: flex-start; gap: .6rem; padding: .45rem .25rem; cursor: pointer; }
    input { width: 1rem; height: 1rem; margin: .25rem 0 0; flex: none; accent-color: #181818; }
    small { display: block; color: #555; font-size: .875rem; }
    .start { background: #ededed; }
    footer { margin-top: 1rem; }
    button { padding: .5rem .85rem; font: inherit; font-weight: 650; }
    button:disabled { color: #444; background: #eee; border: 1px solid #777; }
    details.add-more { position: relative; }
    .add-more summary { cursor: pointer; background: white; }
    .add-more summary::after { content: " ▾"; }
    .add-more ul { list-style: none; margin: .25rem 0 0; padding: .4rem; position: absolute; z-index: 1; min-width: 9rem; background: white; border: 1px solid #777; }
    .add-more button { width: 100%; text-align: left; background: white; }
    .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .5rem; }
    .action { display: inline-block; border: 1px solid #222; padding: .5rem .85rem; font-weight: 650; }
    .add-more ul { bottom: 100%; margin: 0 0 .25rem; }
    .add-more li + li { margin-top: .4rem; }
    .timing { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .75rem; }
    .timing label { display: grid; gap: .25rem; padding: 0; }
    .timing input { width: 100%; height: auto; min-height: 2.5rem; margin: 0; padding: .4rem; font: inherit; }
    .next { background: #181818; color: white; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Do</h1>
      <p>Starting Enter · <strong>Gather Supplies</strong></p>
    </header>

    <fieldset aria-describedby="selection-help">
      <legend>Choose your work set</legend>
      <p id="selection-help">Check the Enters you want to work on now.</p>
      <ul class="tree" role="list">
        <li>
          <label><input type="checkbox"> <span>Grow my own Food</span></label>
          <ul role="list">
            <li>
              <label><input type="checkbox"> <span>Plant Seeds<small>Part of Grow my own Food</small></span></label>
              <ul role="list">
                <li>
                  <label class="start">
                    <input type="checkbox" checked>
                    <span><strong>Gather Supplies</strong><small>Plant Seeds depends on this Enter</small><small>Potting soil, tray, seeds, water</small></span>
                  </label>
                </li>
                <li>
                  <label><input type="checkbox"> <span>Select seed type<small>Get more specific about Plant Seeds</small></span></label>
                </li>
              </ul>
            </li>
          </ul>
        </li>
      </ul>
    </fieldset>

    <fieldset>
      <legend>Work set timing</legend>
      <div class="timing">
        <label for="start-date">Start date
          <input id="start-date" type="date">
        </label>
        <label for="end-date">End date
          <input id="end-date" type="date">
        </label>
        <label for="estimated-time">Estimated time (minutes)
          <input id="estimated-time" type="number" min="1" step="1" inputmode="numeric">
        </label>
      </div>
    </fieldset>

    <footer>
      <div class="actions">
        <details class="add-more">
          <summary class="action">Add More</summary>
          <ul>
            <li><button type="button" class="action">Add Baby</button></li>
            <li><button type="button" class="action">Add Peer</button></li>
            <li><button type="button" class="action">See Tree</button></li>
          </ul>
        </details>
        <a class="action next" href="commit.html">Commit</a>
      </div>
      <small>Prototype preview. You can change selections on this page.</small>
    </footer>
  </main>
</body>
</html>
